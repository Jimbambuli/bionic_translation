# libc_bio.so pulls in libptread_bio.so (pthreads are in libc.so on android)
libc.so             libc_bio.so.0
libstdc++.so        libstdc++_bio.so.0
# the linker namespace API (android_create_namespace & co.) lives in the shim linker
libdl_android.so    libdl_bio.so.0
# the host libm stands in for Android's libm.so (dlopen("libm.so") by name, e.g. a native bridge's proxy)
libm.so             libm.so.6
# TODO: put in separate cfg file, installed by atl
libandroid.so       libandroid.so.0
# ATL's framework natives stand for libandroid_runtime (AndroidRuntime::registerNativeMethods & co.)
libandroid_runtime.so libtranslation_layer_main.so
# ATL implements the jnigraphics NDK API (AndroidBitmap_*) in its libandroid
libjnigraphics.so   libandroid.so.0
# and the ANativeWindow_* and AMediaCodec_*/AMediaFormat_* ones of libnativewindow and libmediandk
libnativewindow.so  libandroid.so.0
libmediandk.so      libandroid.so.0
# and the native MIDI API and the camera NDK (libamidi, libcamera2ndk); libaaudio.so is ATL's own libaaudio.so.0 (its cfg)
libamidi.so         libandroid.so.0
libcamera2ndk.so    libandroid.so.0
libopenxr_loader.so libopenxr_loader.so.1
# TODO: put in separate cfg file, installed by libsles_standalone
libOpenSLES.so      libOpenSLES.so.1
libOpenMAXAL.so     libOpenMAXAL.so.1
# TODO: not sure where to put these
libEGL.so           libEGL.so.1
libGLESv2.so        libGLESv2.so.2
libGLESv3.so        libGLESv2.so.2 # GLESv3 is a symlink to GLESv2 if it exists at all
libvulkan.so        libvulkan.so.1
